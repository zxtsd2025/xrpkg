[package]
name = "xrpkg"
version = "0.1.0"
edition = "2021"
description = "xrpkg：自建 LFS 发行版包管理器（原生 .xpkg + deb/rpm/arch 兼容轨道）"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
toml = "1.1"
resolvo = { version = "0.12.2", default-features = false }
rusqlite = { version = "0.41.1", default-features = false, features = ["bundled"] }
tar = { version = "0.4.46", default-features = false }
zstd = "0.14.3"
goblin = { version = "0.10.7", default-features = false, features = ["std", "elf32", "elf64", "endian_fd"] }
ar = "0.9.0"
deb822-lossless = { version = "0.5.20", default-features = false }
flate2 = "1.1.10"
liblzma = { version = "0.4.9", default-features = false, features = ["static"] }
rpm = { version = "0.30.2", default-features = false, features = ["payload", "gzip-compression", "zstd-compression", "xz-compression"] }
ureq = "2.12"
sha2 = "0.10"
indicatif = "0.17"
xattr = "1"
base64 = "0.22"
libc = "0.2"

[dev-dependencies]
tempfile = "3.27.0"

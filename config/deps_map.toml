# xrpkg 外部依赖映射表
# 左边是 Debian/RPM/Arch 的依赖源名称，右边是 xrpkg 内部 Capability。
[mappings]
"libc6" = "glibc >= 2.44"
"libssl3" = "openssl >= 3.0"
"openssl-libs" = "openssl >= 3.0"
"libc.so.6" = "glibc >= 2.44"# 阶段 32：XFCE/Xorg 兼容轨道需要的 soname/虚拟依赖映射。
# 左值是 Arch 包 .PKGINFO 里的 soname，右值是提供它的 Arch 包名。
"libFLAC.so" = "flac"
"libaudit.so" = "audit"
"libbrotlidec.so" = "brotli"
"libbz2.so" = "bzip2"
"libcap-ng.so" = "libcap-ng"
"libcom_err.so" = "e2fsprogs"
"libcrypt.so" = "libxcrypt"
"libcrypto.so" = "openssl"
"libdbus-1.so" = "dbus"
"libegl" = "libglvnd"
"libexpat.so" = "expat"
"libffi.so" = "libffi"
"libfreetype.so" = "freetype2"
"libgcc_s.so" = "libgcc"
"libgdbm.so" = "gdbm"
"libgio-2.0.so" = "glib2"
"libgl" = "libglvnd"
"libglib-2.0.so" = "glib2"
"libgmodule-2.0.so" = "glib2"
"libgobject-2.0.so" = "glib2"
"libgraphite2.so" = "graphite"
"libgssapi_krb5.so" = "krb5"
"libicuuc.so" = "icu"
"libidn2.so" = "libidn2"
"libjpeg.so" = "libjpeg-turbo"
"libjson-glib-1.0.so" = "json-glib"
"libkeyutils.so" = "keyutils"
"libkrb5.so" = "krb5"
"libltdl" = "libtool"
"liblzma.so" = "xz"
"libmount.so" = "util-linux-libs"
"libmp3lame.so" = "lame"
"libmpg123.so" = "mpg123"
"libncursesw.so" = "ncurses"
"libogg.so" = "libogg"
"libopus.so" = "opus"
"libpng16.so" = "libpng"
"libpsl.so" = "libpsl"
"libreadline.so" = "readline"
"libsasl2.so" = "libsasl"
"libseccomp.so" = "libseccomp"
"libspeexdsp.so" = "speexdsp"
"libss.so" = "e2fsprogs"
"libsystemd" = "systemd-libs"
"libsystemd.so" = "systemd-libs"
"libudev.so" = "systemd-libs"
"libunistring.so" = "libunistring"
"libusb-1.0.so" = "libusb"
"libverto-module-base" = "libverto"
"libverto.so" = "libverto"
"libvorbis.so" = "libvorbis"
"libvorbisenc.so" = "libvorbis"
"libz.so" = "zlib"
"libzstd.so" = "zstd"
"opengl-driver" = "mesa"
"sh" = "bash"
"glibc" = "glibc >= 2.44"

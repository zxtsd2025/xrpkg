# LFS 12.1 GCC-13.2.0；gmp/mpfr/mpc 使用源码树内构建。
name = "gcc"
version = "13.2.0"
source = [
  { url = "https://ftp.gnu.org/gnu/gcc/gcc-13.2.0/gcc-13.2.0.tar.xz", sha256 = "e275e76442a6067341a27f04c5c6b83d8613144004c0413528863dc6b5c743da" },
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" },
  { url = "https://ftp.gnu.org/gnu/mpfr/mpfr-4.2.1.tar.xz", sha256 = "277807353a6726978996945af13e52829e3abd7a9a5b7fb2793894e18f1fcbb2" },
  { url = "https://ftp.gnu.org/gnu/mpc/mpc-1.3.1.tar.gz", sha256 = "ab642492f5cf882b74aa0cb730cd410a81edcdbec895183ce930e706c1c759b8" },
]
requires = []

build = [
  "cd gcc-13.2.0 && mv ../gmp-6.3.0 gmp && mv ../mpfr-4.2.1 mpfr && mv ../mpc-1.3.1 mpc && find gmp mpfr mpc -name Makefile.in -exec touch {} + && case $(uname -m) in x86_64) sed -e '/m64=/s/lib64/lib/' -i.orig gcc/config/i386/t-linux64 ;; esac && mkdir -p build && cd build && ../configure --prefix=/usr LD=ld --enable-languages=c,c++ --enable-default-pie --enable-default-ssp --disable-multilib --disable-bootstrap --disable-fixincludes --with-system-zlib",
  "cd gcc-13.2.0/build && make",
]

package = [
  "cd gcc-13.2.0/build && make DESTDIR=\"$PKGDIR\" install",
  "ln -sfv gcc \"$PKGDIR/usr/bin/cc\"",
  "ln -sfv gcc.1 \"$PKGDIR/usr/share/man/man1/cc.1\"",
  "ln -sfvr \"$PKGDIR/usr/bin/cpp\" \"$PKGDIR/usr/lib/cpp\"",
  "mkdir -p \"$PKGDIR/usr/lib/bfd-plugins\" && ln -sfv ../../libexec/gcc/$(gcc -dumpmachine)/13.2.0/liblto_plugin.so \"$PKGDIR/usr/lib/bfd-plugins/\"",
]
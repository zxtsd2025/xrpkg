# GMP-6.3.0；提供 libgmp.so.10，是 ISL 的运行时依赖。
name = "gmp"
version = "6.3.0"
source = [
  { url = "https://ftp.gnu.org/gnu/gmp/gmp-6.3.0.tar.xz", sha256 = "a3c2b80201b89e68616f4ad30bc66aee4927c3ce50e33929ca819d5c43538898" },
]
requires = ["glibc >= 2.0"]

build = [
  "cd gmp-6.3.0 && CFLAGS='-O2 -std=gnu17' ./configure --prefix=/usr --disable-static --enable-shared",
  "cd gmp-6.3.0 && make",
]

package = [
  "cd gmp-6.3.0 && make DESTDIR=\"$PKGDIR\" install",
]

# LFS 12.1 Linux-6.7.4；defconfig 适合 x86_64 首次启动验证。
name = "linux"
version = "6.7.4"
source = [
  { url = "https://www.kernel.org/pub/linux/kernel/v6.x/linux-6.7.4.tar.xz", sha256 = "f68d9f5ffc0a24f850699b86c8aea8b8687de7384158d5ed3bede37de098d60c" },
]
requires = []

build = [
  "cd linux-6.7.4 && make mrproper && make defconfig && scripts/config --disable WERROR --disable DEBUG_INFO_BTF --enable BLK_DEV_NVME --enable EXT4_FS --enable EFI --enable FB --enable FB_EFI --enable FAT_FS --enable VFAT_FS --enable DEVTMPFS --enable DEVTMPFS_MOUNT && make olddefconfig",
  "cd linux-6.7.4 && grep -qx \"CONFIG_BLK_DEV_NVME=y\" .config && grep -qx \"CONFIG_EXT4_FS=y\" .config && grep -qx \"CONFIG_EFI=y\" .config && grep -qx \"CONFIG_FB_EFI=y\" .config && grep -qx \"CONFIG_VFAT_FS=y\" .config && grep -qx \"CONFIG_DEVTMPFS=y\" .config && grep -qx \"CONFIG_DEVTMPFS_MOUNT=y\" .config",
  "cd linux-6.7.4 && make CC=\"gcc -std=gnu11\" HOSTCC=\"gcc -std=gnu11\" KCFLAGS=\"-std=gnu11\"",
]

package = [
  "mkdir -p \"$PKGDIR/boot\"",
  "cd linux-6.7.4 && make INSTALL_MOD_PATH=\"$PKGDIR\" modules_install && rm -f \"$PKGDIR/lib/modules/6.7.4/build\" \"$PKGDIR/lib/modules/6.7.4/source\"",
  "cd linux-6.7.4 && make INSTALL_PATH=\"$PKGDIR/boot\" install",
  "cd linux-6.7.4 && install -Dm644 arch/x86/boot/bzImage \"$PKGDIR/boot/bzImage\"",
]